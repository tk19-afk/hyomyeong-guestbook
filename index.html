<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>효명고 교원 방명록 🏫</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 최상단 헤더 네비게이션 -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">🏫</span>
        <div class="brand-text">
          <h1>효명고 교원 방명록</h1>
          <span class="badge-domain">@hmh.or.kr 전용 공간</span>
        </div>
      </div>

      <!-- 로그인/사용자 프로필 영역 -->
      <div class="auth-area" id="authArea">
        <button id="loginBtn" class="btn btn-google">
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>구글 로그인</span>
        </button>

        <!-- 로그인 후 표시될 프로필 (기본 숨김) -->
        <div id="userProfile" class="user-profile hidden">
          <img id="userAvatar" class="user-avatar" src="" alt="프로필">
          <div class="user-meta">
            <span id="userName" class="user-name">선생님</span>
            <span class="user-domain-badge">인증됨</span>
          </div>
          <button id="logoutBtn" class="btn btn-outline-sm">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="main-container">
    <!-- 인트로 배너 -->
    <section class="hero-banner">
      <h2>선생님들의 오늘 하루를 응원합니다 ☕✨</h2>
      <p>동료 교사와 함께 나누는 따뜻한 한마디와 유쾌한 움짤로 마음을 전해보세요.</p>
    </section>

    <!-- 글 작성 카드 섹션 -->
    <section class="form-card">
      <div class="form-header">
        <h3 class="form-title">💬 방명록 한 줄 남기기</h3>
        <label class="anonymous-toggle" title="체크 시 이름을 '익명의 효명인'으로 등록합니다">
          <input type="checkbox" id="anonCheck">
          <span class="toggle-slider"></span>
          <span class="toggle-label">익명으로 남기기</span>
        </label>
      </div>

      <!-- 태그 선택 -->
      <div class="tag-selector">
        <span class="tag-label">카테고리:</span>
        <button type="button" class="tag-chip active" data-tag="응원">💪 응원</button>
        <button type="button" class="tag-chip" data-tag="축하">🎉 축하</button>
        <button type="button" class="tag-chip" data-tag="감사">🙏 감사</button>
        <button type="button" class="tag-chip" data-tag="힐링">☕ 힐링</button>
        <button type="button" class="tag-chip" data-tag="칼퇴">🚀 칼퇴기원</button>
      </div>

      <!-- 메시지 입력창 -->
      <div class="input-group">
        <textarea id="messageInput" rows="3" placeholder="동료 교사들에게 전하고 싶은 따뜻한 이야기나 응원의 메시지를 적어주세요..."></textarea>
      </div>

      <!-- 첨부된 Tenor GIF 미리보기 영역 (선택 시 노출) -->
      <div id="gifPreviewContainer" class="gif-preview-container hidden">
        <div class="gif-preview-card">
          <img id="gifPreviewImg" src="" alt="선택된 GIF">
          <button type="button" id="removeGifBtn" class="btn-remove-gif" title="GIF 첨부 취소">✕</button>
        </div>
      </div>

      <!-- 폼 하단 도구 및 등록 버튼 -->
      <div class="form-actions">
        <button type="button" id="openGifModalBtn" class="btn btn-secondary">
          <span class="btn-icon">🎬</span>
          <span>Tenor 움짤(GIF) 찾기</span>
        </button>
        
        <button type="button" id="submitBtn" class="btn btn-primary">
          <span>남기기 💌</span>
        </button>
      </div>
    </section>

    <!-- 실시간 방명록 피드 섹션 -->
    <section class="feed-section">
      <div class="feed-header">
        <h3>실시간 방명록 이야기 <span id="feedCount" class="feed-count">0</span></h3>
        <span class="feed-status-dot" title="실시간 동기화 중">실시간 라이브</span>
      </div>

      <!-- 방명록 카드 목록 -->
      <div id="feedList" class="feed-grid">
        <!-- 자바스크립트로 동적 렌더링 -->
      </div>
    </section>
  </main>

  <!-- Tenor GIF 검색 모달 팝업 -->
  <div id="gifModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3>🎬 실시간 글로벌 GIF 검색</h3>
          <span class="tenor-badge">Powered by GIPHY API</span>
        </div>
        <button type="button" id="closeGifModalBtn" class="btn-close-modal">✕</button>
      </div>

      <div class="modal-body">
        <!-- 검색어 입력창 -->
        <div class="modal-search-box">
          <input type="text" id="gifSearchInput" placeholder="검색하고 싶은 어떤 단어든 입력하세요 (예: 당황, 배고파, 퇴근, 피곤, 축하)..." autocomplete="off">
          <button type="button" id="gifSearchBtn" class="btn btn-search">검색</button>
        </div>

        <!-- 빠른 추천 검색어 칩 -->
        <div class="quick-keywords">
          <span>추천:</span>
          <button type="button" class="quick-chip" data-keyword="슬퍼">#슬퍼 🥺</button>
          <button type="button" class="quick-chip" data-keyword="mad">#mad 🔥</button>
          <button type="button" class="quick-chip" data-keyword="박수">#박수 👏</button>
          <button type="button" class="quick-chip" data-keyword="칼퇴">#칼퇴 🏃</button>
          <button type="button" class="quick-chip" data-keyword="화이팅">#화이팅 💪</button>
          <button type="button" class="quick-chip" data-keyword="축하">#축하 🎉</button>
          <button type="button" class="quick-chip" data-keyword="커피">#커피 ☕</button>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="gifLoading" class="gif-loading hidden">
          <div class="spinner"></div>
          <p>재미있는 움짤을 불러오는 중...</p>
        </div>

        <!-- GIF 검색 결과 그리드 -->
        <div id="gifResults" class="gif-results-grid">
          <!-- GIF 결과 아이템들이 동적으로 주입됩니다 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <p>© 효명고등학교 교원 소통 프로젝트 | Made with Antigravity 🚀</p>
  </footer>

  <!-- Firebase Modular SDK Scripts (CDN) -->
  <script type="module" src="app.js"></script>
</body>
</html>
